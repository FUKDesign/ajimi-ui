<title id="title">味見のおもち</title><desc id="desc">昭和の台所のゴム印を思わせる、手彫りの輪郭。白くてやわらかい丸餅に朱色の三角巾をかぶせ、折り目と横にのぞく結び目を目印にする。木べらを持ったおもち。</desc>
